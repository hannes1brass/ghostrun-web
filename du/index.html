<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghostrun · Mein Bereich</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b2b2b">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="in">
      <a class="brand" href="/"><svg class="px" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0h4v1h-4zM5 1h4v1h-4zM4 2h4v1h-4zM3 3h4v1h-4zM2 4h9v1h-9zM1 5h9v1h-9zM5 6h4v1h-4zM4 7h4v1h-4zM3 8h4v1h-4zM2 9h3v1h-3zM1 10h2v1h-2z"/></svg><span>GHOSTRUN</span></a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="/">Startseite</a>
        <button class="btn secondary" type="button" id="signout">Abmelden</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <p class="muted" id="loading" style="padding: 48px 0" aria-live="polite">Einen Moment …</p>
    <p class="error" id="load-error" style="padding: 48px 0" aria-live="assertive"></p>

    <div class="account" id="account" hidden>
      <section class="account-head">
        <span class="label" id="since"></span>
        <h1 id="hello"></h1>
        <p class="muted" id="email"></p>
      </section>

      <section class="stats" aria-label="Deine Zahlen">
        <div class="stat"><span class="label">Distanz</span><span class="value" id="s-distance"></span></div>
        <div class="stat"><span class="label">Aktivitäten</span><span class="value" id="s-count"></span></div>
        <div class="stat"><span class="label">In Bewegung</span><span class="value" id="s-time"></span></div>
        <div class="stat"><span class="label">Rivalen besiegt</span><span class="value" id="s-rivals"></span></div>
      </section>

      <div class="columns">
        <section class="panel">
          <h2>Letzte Aktivitäten</h2>
          <div class="rows" id="activities"></div>
        </section>
        <div class="stack">
          <section class="panel">
            <h2>Bestzeiten auf Strecken</h2>
            <div class="rows" id="bests"></div>
          </section>
          <section class="panel">
            <h2>Rivalen</h2>
            <div class="rows" id="rivals"></div>
          </section>
        </div>
      </div>

      <p class="small muted">Aufzeichnen, Strecken erstellen und Rennen laufen geht in der Ghostrun-App. Die App kommt bald für iPhone und Android.</p>
    </div>
  </main>

  <footer class="site-footer">

    <a href="/datenschutz/">Datenschutz</a>
    <a href="/impressum/">Impressum</a>
  </footer>
  <script src="/assets/vendor/supabase-2.117.3.js"></script>
  <script src="/assets/client.js"></script>
  <script src="/assets/account.js"></script>
</body>
</html>
